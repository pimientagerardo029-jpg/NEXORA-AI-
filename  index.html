
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>NEXORA IA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#080808;color:#fff;
 font-family:Arial,sans-serif;
 display:flex;min-height:100vh;
}
.sidebar{
 width:250px;background:#111;
 border-right:1px solid #292929;
 padding:22px 16px;
}
.logo{font-size:23px;font-weight:bold;letter-spacing:2px}
.new{
 width:100%;margin-top:30px;padding:13px;
 background:#202020;color:white;
 border:1px solid #383838;border-radius:9px;
 cursor:pointer;
}
main{
 flex:1;min-width:0;display:flex;
 flex-direction:column;align-items:center;
 padding:30px 20px;
}
.welcome{text-align:center;margin-top:65px}
.welcome h1{font-size:38px;margin-bottom:12px}
.welcome p{color:#999}
#chat{
 width:100%;max-width:780px;
 flex:1;overflow-y:auto;padding:25px 5px;
}
.message{
 background:#191919;border:1px solid #303030;
 border-radius:12px;padding:15px;
 margin-bottom:14px;line-height:1.5;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.message strong{display:block;margin-bottom:7px}
form{
 width:100%;max-width:780px;
 display:flex;gap:10px;margin:15px 0;
}
input{
 flex:1;min-width:0;padding:15px;
 background:#171717;color:white;
 border:1px solid #383838;border-radius:12px;
 font-size:15px;outline:none;
}
form button{
 padding:0 22px;background:white;color:black;
 border:0;border-radius:12px;font-weight:bold;
 cursor:pointer;
}
.status{color:#777;font-size:11px;margin-bottom:8px}
@media(max-width:600px){
 .sidebar{width:85px;padding:14px 8px}
 .logo{font-size:13px;letter-spacing:0}
 .new{font-size:11px;padding:9px 4px}
 .welcome h1{font-size:29px}
}
</style>
</head>

<body>
<aside class="sidebar">
 <div class="logo">NEXORA IA</div>
 <button class="new" onclick="newChat()">+ Nuevo chat</button>
</aside>

<main>
 <section class="welcome" id="welcome">
  <h1>NEXORA IA</h1>
  <p>Tu inteligencia artificial, lista para ayudarte.</p>
 </section>

 <section id="chat"></section>

 <form id="form">
  <input id="message" placeholder="Escribe tu mensaje..." autocomplete="off" required>
  <button type="submit" id="send">Enviar</button>
 </form>

 <div class="status">NEXORA IA · Inteligencia artificial</div>
</main>

<script>
const form=document.getElementById("form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const send=document.getElementById("send");

function addMessage(author,text){
 const box=document.createElement("div");
 box.className="message";
 const title=document.createElement("strong");
 title.textContent=author;
 const content=document.createElement("div");
 content.textContent=text;
 box.append(title,content);
 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
 return content;
}

function newChat(){
 chat.replaceChildren();
 welcome.style.display="block";
}

form.addEventListener("submit",async e=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;

 welcome.style.display="none";
 addMessage("Tú",message);
 input.value="";
 send.disabled=true;

 const answer=addMessage("NEXORA IA","Pensando...");

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Error del servidor.");
  }

  answer.textContent=data.reply||data.message||"Respuesta vacía.";
 }catch(error){
  answer.textContent="No se pudo obtener una respuesta: "+error.message;
 }finally{
  send.disabled=false;
  input.focus();
 }
});
</script>
</body>
</html>
